name: C/C++ CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Compilation du projet
        run: make

      - name: Tests complets
        run: make full_test

      - name: Nettoyage
        run: make fclean
      